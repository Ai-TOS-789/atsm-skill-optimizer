<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATSM Live Agent Dashboard</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root {
  /* Dark theme (default) */
  --bg-primary: #0a0e17;
  --bg-secondary: #0d1321;
  --bg-tertiary: #1a2035;
  --bg-input: #1e293b;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --accent-active: #1d4ed8;
  --border: #2a3447;
  --border-input: #334155;
  --glow: #7dd3fc;
  --success: #4ade80;
  --warning: #fbbf24;
  --danger: #ef4444;
  --purple: #c084fc;
  --overlay: rgba(0,0,0,0.6);
  --shadow: rgba(0,0,0,0.5);
  --legend-bg: rgba(13, 19, 33, 0.9);
  --status-bg: rgba(13, 19, 33, 0.9);
  --banner-bg: linear-gradient(135deg, #1e3a5f 0%, #0d1321 100%);
  --banner-text: #7dd3fc;
  --node-stroke: #1e293b;
  --edge-color: #4a5568;
  --panel-bg: #0d1321;
  --detail-bg: #0a0f1a;
  --graph-bg: radial-gradient(ellipse at center, #0f172a 0%, #020617 100%);
  --badge-score-bg: #1e3a5f;
  --badge-score-text: #7dd3fc;
  --badge-success-bg: #1a3a2e;
  --badge-success-text: #4ade80;
  --badge-rel-bg: #2d2a1a;
  --badge-rel-text: #fbbf24;
  --badge-obs-bg: #2a1a2e;
  --badge-obs-text: #c084fc;
  --log-entry-bg: #1a2035;
  --log-time: #64748b;
  --log-action: #7dd3fc;
  --log-skill: #4ade80;
  --pulse-ring: #3b82f6;
}

[data-theme="light"] {
  --bg-primary: #f8fafc;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f1f5f9;
  --bg-input: #ffffff;
  --text-primary: #1e293b;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --accent-active: #1d4ed8;
  --border: #e2e8f0;
  --border-input: #cbd5e1;
  --glow: #0369a1;
  --success: #16a34a;
  --warning: #ca8a04;
  --danger: #dc2626;
  --purple: #9333ea;
  --overlay: rgba(0,0,0,0.3);
  --shadow: rgba(0,0,0,0.1);
  --legend-bg: rgba(255, 255, 255, 0.95);
  --status-bg: rgba(255, 255, 255, 0.95);
  --banner-bg: linear-gradient(135deg, #dbeafe 0%, #ffffff 100%);
  --banner-text: #0369a1;
  --node-stroke: #cbd5e1;
  --edge-color: #94a3b8;
  --panel-bg: #ffffff;
  --detail-bg: #f8fafc;
  --graph-bg: radial-gradient(ellipse at center, #f1f5f9 0%, #e2e8f0 100%);
  --badge-score-bg: #dbeafe;
  --badge-score-text: #0369a1;
  --badge-success-bg: #dcfce7;
  --badge-success-text: #16a34a;
  --badge-rel-bg: #fef9c3;
  --badge-rel-text: #ca8a04;
  --badge-obs-bg: #f3e8ff;
  --badge-obs-text: #9333ea;
  --log-entry-bg: #f1f5f9;
  --log-time: #94a3b8;
  --log-action: #0369a1;
  --log-skill: #16a34a;
  --pulse-ring: #3b82f6;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background 0.3s, color 0.3s;
}

/* ===== CURRENT TASK BANNER ===== */
.task-banner {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 10px 24px;
  background: var(--banner-bg);
  border-bottom: 1px solid var(--border);
  z-index: 20;
  animation: slideDown 0.3s ease-out;
}
.task-banner.active { display: flex; }
@keyframes slideDown {
  from { transform: translateY(-100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.task-banner .task-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: spin 2s linear infinite;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.task-banner .task-icon svg {
  width: 18px;
  height: 18px;
  fill: white;
}
.task-banner .task-info { flex: 1; }
.task-banner .task-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.task-banner .task-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--banner-text);
}
.task-banner .task-close {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 18px;
  padding: 4px 8px;
  border-radius: 4px;
}
.task-banner .task-close:hover { background: var(--bg-tertiary); }

/* ===== HEADER ===== */
.header {
  background: var(--bg-secondary);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid var(--border);
  z-index: 10;
}
.header h1 {
  font-size: 18px;
  font-weight: 600;
  color: var(--glow);
  margin: 0;
  white-space: nowrap;
}
.header .subtitle {
  font-size: 11px;
  color: var(--text-muted);
}
.input-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  max-width: 600px;
}
.input-group input {
  flex: 1;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border-input);
  background: var(--bg-input);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.input-group input:focus { border-color: var(--accent); }

/* ===== TOGGLE BUTTONS ===== */
.toggle-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.toggle-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border-input);
  background: var(--bg-input);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.toggle-btn:hover { border-color: var(--accent); }
.toggle-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.toggle-btn .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: background 0.2s;
}
.toggle-btn.active .dot { background: var(--success); animation: pulse-dot 1.5s infinite; }
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.input-group button.primary {
  padding: 8px 20px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
}
.input-group button.primary:hover { background: var(--accent-hover); }
.input-group button.primary:active { background: var(--accent-active); }

/* ===== MAIN CONTAINER ===== */
.main-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.graph-container {
  flex: 1;
  position: relative;
  background: var(--graph-bg);
}
.graph-container svg { width: 100%; height: 100%; }

/* ===== SIDE PANEL ===== */
.side-panel {
  width: 360px;
  background: var(--panel-bg);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel-header .refresh-indicator {
  font-size: 11px;
  color: var(--success);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ===== MINI LOG ===== */
.mini-log {
  border-bottom: 1px solid var(--border);
  max-height: 180px;
  overflow-y: auto;
  background: var(--bg-primary);
}
.mini-log-header {
  padding: 8px 16px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.mini-log-header .live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--danger);
}
.mini-log-header .live-dot.active {
  background: var(--success);
  animation: pulse-dot 1.5s infinite;
}
.log-entry {
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  transition: background 0.2s;
}
.log-entry:hover { background: var(--log-entry-bg); }
.log-entry .log-time {
  color: var(--log-time);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.log-entry .log-text { flex: 1; }
.log-entry .log-action { color: var(--log-action); font-weight: 500; }
.log-entry .log-skill { color: var(--log-skill); font-weight: 600; }
.log-entry .log-empty {
  color: var(--text-muted);
  font-style: italic;
}

/* ===== RANKED LIST ===== */
.ranked-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.ranked-list::-webkit-scrollbar { width: 6px; }
.ranked-list::-webkit-scrollbar-track { background: var(--bg-secondary); }
.ranked-list::-webkit-scrollbar-thumb { background: var(--border-input); border-radius: 3px; }
.rank-item {
  padding: 10px 14px;
  margin-bottom: 6px;
  background: var(--bg-tertiary);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
}
.rank-item:hover {
  background: var(--bg-input);
  border-color: var(--border-input);
  transform: translateX(2px);
}
.rank-item.selected {
  border-color: var(--accent);
  background: var(--bg-input);
}
.rank-item .rank-number {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  margin-right: 8px;
}
.rank-item .skill-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
}
.rank-item .skill-desc {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rank-item .skill-meta {
  display: flex;
  gap: 8px;
  margin-top: 6px;
  font-size: 10px;
  flex-wrap: wrap;
}
.rank-item .skill-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}
.badge {
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
}
.badge-score { background: var(--badge-score-bg); color: var(--badge-score-text); }
.badge-success { background: var(--badge-success-bg); color: var(--badge-success-text); }
.badge-rel { background: var(--badge-rel-bg); color: var(--badge-rel-text); }
.badge-obs { background: var(--badge-obs-bg); color: var(--badge-obs-text); }

/* ===== NODE TOOLTIP ===== */
.node-tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--bg-input);
  border: 1px solid var(--border-input);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text-primary);
  max-width: 250px;
  box-shadow: 0 4px 20px var(--shadow);
  z-index: 100;
  display: none;
}
.node-tooltip .tip-name { font-weight: 600; color: var(--glow); margin-bottom: 4px; }
.node-tooltip .tip-detail { color: var(--text-secondary); font-size: 11px; }

/* ===== DETAIL PANEL ===== */
.detail-panel {
  padding: 16px;
  border-top: 1px solid var(--border);
  background: var(--detail-bg);
  max-height: 320px;
  overflow-y: auto;
  display: none;
}
.detail-panel.visible { display: block; }
.detail-panel h3 {
  font-size: 14px;
  font-weight: 600;
  color: var(--glow);
  margin-bottom: 8px;
}
.detail-panel p {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 8px;
}
.detail-panel .stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}
.stat-box {
  background: var(--bg-tertiary);
  padding: 8px 10px;
  border-radius: 6px;
}
.stat-box .stat-label {
  font-size: 9px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.stat-box .stat-value {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-top: 2px;
}
.outcome-section {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.outcome-section .outcome-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.outcome-buttons {
  display: flex;
  gap: 8px;
}
.outcome-btn {
  flex: 1;
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--border-input);
  background: var(--bg-input);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.outcome-btn:hover { border-color: var(--accent); }
.outcome-btn.success:hover { border-color: var(--success); background: var(--badge-success-bg); }
.outcome-btn.failure:hover { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
.outcome-btn .icon { font-size: 14px; }
.outcome-feedback {
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 11px;
  display: none;
}
.outcome-feedback.show { display: block; }
.outcome-feedback.success {
  background: var(--badge-success-bg);
  color: var(--badge-success-text);
  border: 1px solid var(--success);
}
.outcome-feedback.failure {
  background: rgba(239, 68, 68, 0.1);
  color: var(--danger);
  border: 1px solid var(--danger);
}

/* ===== LEGEND ===== */
.legend {
  position: absolute;
  bottom: 16px;
  left: 16px;
  background: var(--legend-bg);
  border: 1px solid var(--border-input);
  border-radius: 8px;
  padding: 12px;
  font-size: 11px;
  color: var(--text-secondary);
}
.legend-title { color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.legend-swatch { width: 16px; height: 12px; border-radius: 2px; }

/* ===== STATUS BAR ===== */
.status-bar {
  position: absolute;
  bottom: 16px;
  right: 16px;
  background: var(--status-bg);
  border: 1px solid var(--border-input);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 11px;
  color: var(--text-muted);
}

/* ===== SVG GRAPH ELEMENTS ===== */
.node-circle {
  cursor: pointer;
  stroke: var(--node-stroke);
  stroke-width: 2px;
  transition: stroke 0.2s;
}
.node-circle:hover {
  stroke: var(--accent);
  stroke-width: 3px;
}
.node-label {
  font-size: 10px;
  fill: var(--text-secondary);
  pointer-events: none;
  text-anchor: middle;
  font-weight: 500;
}
.edge {
  stroke-opacity: 0.4;
  fill: none;
  transition: stroke-opacity 0.3s, stroke-width 0.3s;
}
.edge:hover { stroke-opacity: 0.8; }

/* ===== PULSE ANIMATION ===== */
.node-pulse {
  animation: node-pulse-anim 1s ease-out;
}
@keyframes node-pulse-anim {
  0% {
    filter: drop-shadow(0 0 0px var(--pulse-ring));
    stroke: var(--accent);
    stroke-width: 6px;
  }
  50% {
    filter: drop-shadow(0 0 12px var(--pulse-ring));
    stroke: var(--glow);
    stroke-width: 8px;
  }
  100% {
    filter: drop-shadow(0 0 0px transparent);
    stroke: var(--node-stroke);
    stroke-width: 2px;
  }
}
.pulse-ring {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2px;
  opacity: 0;
  animation: pulse-ring-anim 1.5s ease-out forwards;
}
@keyframes pulse-ring-anim {
  0% { r: attr(data-r); opacity: 0.8; stroke-width: 3px; }
  100% { r: calc(attr(data-r) + 30); opacity: 0; stroke-width: 0px; }
}

/* ===== LOADING OVERLAY ===== */
.loading-overlay {
  position: absolute;
  inset: 0;
  background: var(--overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--glow);
  z-index: 50;
}

/* ===== LIVE MODE INDICATOR ===== */
.live-indicator {
  display: none;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--success);
  padding: 4px 10px;
  border-radius: 12px;
  background: rgba(74, 222, 128, 0.1);
  border: 1px solid rgba(74, 222, 128, 0.3);
}
.live-indicator.active { display: flex; }
.live-indicator .live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse-dot 1s infinite;
}
</style>
</head>
<body>

<!-- CURRENT TASK BANNER -->
<div class="task-banner" id="taskBanner">
  <div class="task-icon">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
  </div>
  <div class="task-info">
    <div class="task-label">Agent is working on...</div>
    <div class="task-name" id="taskBannerName">—</div>
  </div>
  <button class="task-close" id="taskBannerClose">&times;</button>
</div>

<!-- HEADER -->
<div class="header">
  <h1>ATSM</h1>
  <span class="subtitle">Live Agent Dashboard</span>
  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Describe task... e.g., 'search and summarize papers'" />
    <button class="primary" id="rankBtn">Rank Skills</button>
  </div>
  <div class="toggle-group">
    <button class="toggle-btn" id="themeToggle" title="Toggle dark/light theme">
      <span class="dot"></span>
      <span id="themeLabel">Dark</span>
    </button>
    <button class="toggle-btn" id="liveToggle" title="Toggle live mode">
      <span class="dot"></span>
      <span>Live Mode</span>
    </button>
    <div class="live-indicator" id="liveIndicator">
      <span class="live-dot"></span>
      <span>POLLING</span>
    </div>
  </div>
</div>

<!-- MAIN CONTAINER -->
<div class="main-container">
  <div class="graph-container" id="graphContainer">
    <svg id="graphSvg"></svg>
    <div class="node-tooltip" id="tooltip"></div>
    <div class="legend">
      <div class="legend-title">P(success)</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#ef4444"></div> 0.0 — Low</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#f59e0b"></div> 0.5 — Mid</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#22c55e"></div> 1.0 — High</div>
      <div class="legend-title" style="margin-top:8px">Node size = Final Score</div>
      <div class="legend-title" style="margin-top:4px">Edge = Co-occurrence</div>
    </div>
    <div class="status-bar" id="statusBar">Ready</div>
    <div class="loading-overlay" id="loadingOverlay" style="display:none">Ranking...</div>
  </div>

  <div class="side-panel">
    <!-- MINI LOG -->
    <div class="mini-log" id="miniLog">
      <div class="mini-log-header">
        <span class="live-dot" id="logLiveDot"></span>
        Recent Agent Actions
      </div>
      <div id="logEntries">
        <div class="log-entry"><span class="log-empty">No actions recorded yet.</span></div>
      </div>
    </div>

    <div class="panel-header">
      <span>Ranked Skills</span>
      <span class="refresh-indicator" id="refreshIndicator">● Auto</span>
    </div>
    <div class="ranked-list" id="rankedList"></div>
    <div class="detail-panel" id="detailPanel">
      <h3 id="detailName"></h3>
      <p id="detailDesc"></p>

// ============================================================
// ATSM ALGORITHM (JavaScript port of atsm.py)
// ============================================================
const ALPHA = 0.6;
const BETA = 0.4;
const PRIOR_SUCCESS = 1.0;
const PRIOR_FAILURE = 1.0;
const DECAY_LAMBDA = 0.01;
const MIN_OBSERVATIONS = 3;

function tokenize(text) {
  return (text.toLowerCase().match(/[a-zA-Z0-9_\u0E00-\u0E7F]+/g) || []);
}

function computeTFIDF(docs) {
  const n = docs.length;
  const df = {};
  docs.forEach(doc => {
    const seen = new Set(doc);
    seen.forEach(term => { df[term] = (df[term] || 0) + 1; });
  });
  const idf = {};
  for (const [term, freq] of Object.entries(df)) {
    idf[term] = Math.log((n + 1) / (1 + freq)) + 1;
  }
  return docs.map(doc => {
    const tf = {};
    doc.forEach(t => { tf[t] = (tf[t] || 0) + 1; });
    const total = doc.length || 1;
    const vec = {};
    for (const [term, count] of Object.entries(tf)) {
      vec[term] = (count / total) * (idf[term] || 0);
    }
    return vec;
  });
}

function cosineSim(a, b) {
  const common = Object.keys(a).filter(k => k in b);
  if (common.length === 0) return 0;
  const dot = common.reduce((s, t) => s + a[t] * b[t], 0);
  const normA = Math.sqrt(Object.values(a).reduce((s, v) => s + v * v, 0));
  const normB = Math.sqrt(Object.values(b).reduce((s, v) => s + v * v, 0));
  if (normA === 0 || normB === 0) return 0;
  return dot / (normA * normB);
}

function keywordOverlap(a, b) {
  const sa = new Set(a);
  const sb = new Set(b);
  if (sa.size === 0 || sb.size === 0) return 0;
  const intersection = new Set([...sa].filter(x => sb.has(x)));
  const union = new Set([...sa, ...sb]);
  return intersection.size / union.size;
}

function computeStats(records) {
  const now = Date.now();
  const stats = {};
  records.forEach(rec => {
    const skill = rec.skill;
    const success = rec.success;
    const ts = new Date(rec.timestamp).getTime();
    const ageDays = Math.max((now - ts) / 86400000, 0);
    const weight = Math.exp(-DECAY_LAMBDA * ageDays);
    
    if (!stats[skill]) {
      stats[skill] = { successes: 0, failures: 0, total: 0, raw_successes: 0, raw_failures: 0, effective_total: 0 };
    }
    const s = stats[skill];
    s.total++;
    s.effective_total += weight;
    if (success) { s.successes += weight; s.raw_successes++; }
    else { s.failures += weight; s.raw_failures++; }
  });

  for (const skill in stats) {
    const s = stats[skill];
    const alphaPost = PRIOR_SUCCESS + s.successes;
    const betaPost = PRIOR_FAILURE + s.failures;
    s.expected_success = alphaPost / (alphaPost + betaPost);
    s.confidence = Math.min(s.effective_total / MIN_OBSERVATIONS, 1.0);
  }
  return stats;
}

function rankSkills(task, skills, records, topK = 20) {
  const stats = computeStats(records);
  const taskTokens = tokenize(task);
  const allTokens = [...skills.map(s => tokenize(s.name + " " + s.description)), taskTokens];
  const vectors = computeTFIDF(allTokens);
  const taskVec = vectors[vectors.length - 1];
  
  const results = skills.map((skill, i) => {
    const relevance = ALPHA * cosineSim(vectors[i], taskVec) + BETA * keywordOverlap(tokenize(skill.name + " " + skill.description), taskTokens);
    const s = stats[skill.name];
    let successProb;
    if (s && s.total > 0) {
      const priorMean = PRIOR_SUCCESS / (PRIOR_SUCCESS + PRIOR_FAILURE);
      successProb = s.confidence * s.expected_success + (1 - s.confidence) * priorMean;
    } else {
      successProb = PRIOR_SUCCESS / (PRIOR_SUCCESS + PRIOR_FAILURE);
    }
    const finalScore = relevance * successProb;
    return {
      name: skill.name,
      description: skill.description,
      category: skill.category,
      relevance: relevance,
      success_prob: successProb,
      final_score: finalScore,
      observations: s ? s.total : 0,
      confidence: s ? s.confidence : 0,
      expected_success: s ? s.expected_success : 0.5
    };
  });
  
  results.sort((a, b) => b.final_score - a.final_score);
  return results.slice(0, topK);
}

// ============================================================
// CO-OCCURRENCE COMPUTATION
// ============================================================
function computeCooccurrence(records) {
  const sorted = [...records].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  const cooc = {};
  
  for (let i = 0; i < sorted.length; i++) {
    for (let j = i + 1; j < sorted.length; j++) {
      const timeDiff = (new Date(sorted[j].timestamp) - new Date(sorted[i].timestamp)) / 1000;
      if (timeDiff > 5) break;
      const key = [sorted[i].skill, sorted[j].skill].sort().join("|||");
      cooc[key] = (cooc[key] || 0) + 1;
    }
  }
  return cooc;
}

function getColor(score) {
  if (score < 0.5) {
    const t = score / 0.5;
    const r = 239;
    const g = Math.round(68 + t * (245 - 68));
    const b = Math.round(68 + t * (15 - 68));
    return `rgb(${r},${g},${b})`;
  } else {
    const t = (score - 0.5) / 0.5;
    const r = Math.round(245 + t * (34 - 245));
    const g = Math.round(159 + t * (197 - 159));
    const b = Math.round(15 + t * (94 - 15));
    return `rgb(${r},${g},${b})`;
  }
}

function getNodeRadius(score) {
  const minR = 8, maxR = 35;
  return minR + (maxR - minR) * Math.min(score * 5, 1);
}

function initGraph() {
  const container = document.getElementById('graphContainer');
  const width = container.clientWidth;
  const height = container.clientHeight;
  
  svg = d3.select('#graphSvg')
    .attr('width', width)
    .attr('height', height);
  
  svg.selectAll('*').remove();
  
  g = svg.append('g');
  
  svg.call(d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (event) => { g.attr('transform', event.transform); }));
  
  // Arrow markers
  svg.append('defs').append('marker')
    .attr('id', 'arrowhead')
    .attr('viewBox', '0 -5 10 10')
    .attr('refX', 20)
    .attr('refY', 0)
    .attr('markerWidth', 6)
    .attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-5L10,0L0,5')
    .attr('fill', '#4a5568');
  
  link = g.append('g').attr('class', 'edges').selectAll('.edge');
  node = g.append('g').attr('class', 'nodes').selectAll('.node');
  label = g.append('g').attr('class', 'labels').selectAll('.node-label');
}

function updateGraph(ranking, pulseSkill) {
  if (!ranking || ranking.length === 0) return;
  
  const container = document.getElementById('graphContainer');
  const width = container.clientWidth;
  const height = container.clientHeight;
  
  currentRanking = ranking;
  const cooc = computeCooccurrence(allRecords);
  
  const nodes = ranking.map(d => ({
    id: d.name,
    data: d,
    radius: getNodeRadius(d.final_score),
    x: width / 2 + (Math.random() - 0.5) * 200,
    y: height / 2 + (Math.random() - 0.5) * 200
  }));
  
  const links = [];
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const key = [nodes[i].id, nodes[j].id].sort().join("|||");
      const weight = cooc[key] || 0;
      
      if (nodes[i].data.category === nodes[j].data.category) {
        const catWeight = 0.5;
        links.push({ source: nodes[i], target: nodes[j], weight: catWeight });
      }
      
      if (weight > 0) {
        links.push({ source: nodes[i], target: nodes[j], weight: weight });
      }
    }
  }
  
  if (simulation) simulation.stop();
  
  // Edges
  link = g.select('.edges').selectAll('.edge').data(links);
  link.exit().remove();
  link = link.enter().append('line')
    .attr('class', 'edge')
    .style('stroke', 'var(--edge-color)')
    .style('stroke-width', d => Math.max(1, d.weight * 2))
    .merge(link);
  
  // Nodes
  const oldNodes = node;
  node = g.select('.nodes').selectAll('.node').data(nodes, d => d.id);
  
  node.exit().remove();
  
  const nodeEnter = node.enter().append('g')
    .attr('class', 'node')
    .style('cursor', 'pointer');
  
  nodeEnter.append('circle')
    .attr('class', 'node-circle')
    .attr('r', d => d.radius)
    .style('fill', d => getColor(d.data.success_prob))
    .style('stroke', 'var(--node-stroke)')
    .style('stroke-width', 2);
  
  nodeEnter.append('text')
    .attr('class', 'node-label')
    .text(d => d.data.name.length > 15 ? d.data.name.substring(0, 13) + '...' : d.data.name)
    .attr('dy', d => d.radius + 12)
    .attr('dy', d => d.radius + 12)
    .attr('fill', 'var(--text-secondary)')
    .attr('font-size', '10px')
    .attr('text-anchor', 'middle')
    .style('pointer-events', 'none');
  
  node = nodeEnter.merge(node);
  
  // Labels
  const oldLabels = label;
  label = g.select('.labels').selectAll('.node-label').data(nodes, d => d.id);
  label.exit().remove();
  
  // Re-append labels merged
  label = g.select('.labels').selectAll('text').data(nodes, d => d.id);
  label.exit().remove();
  
  // Pulse effect on updated skill
  if (pulseSkill) {
    const pulseNode = node.select('circle').filter(d => d.id === pulseSkill);
    if (!pulseNode.empty()) {
      pulseNode.classed('node-pulse', true);
      setTimeout(() => pulseNode.classed('node-pulse', false), 1500);
      
      // Add expanding ring
      const nodeDatum = pulseNode.datum();
      g.select('.nodes').append('circle')
        .attr('class', 'pulse-ring')
        .attr('cx', nodeDatum.x)
        .attr('cy', nodeDatum.y)
        .attr('r', nodeDatum.radius)
        .attr('data-r', nodeDatum.radius)
        .style('r', nodeDatum.radius)
        .transition()
        .duration(1500)
        .style('r', nodeDatum.radius + 30)
        .style('opacity', 0)
        .remove();
    }
  }
  
  // Tooltips
  node.select('.node-circle')
    .on('mouseover', (event, d) => {
      const tooltip = document.getElementById('tooltip');
      tooltip.style.display = 'block';
      tooltip.style.left = (event.pageX + 15) + 'px';
      tooltip.style.top = (event.pageY - 10) + 'px';
      tooltip.innerHTML = `
        <div class="tip-name">${d.data.name}</div>
        <div class="tip-detail">Score: ${d.data.final_score.toFixed(4)} | P(success): ${d.data.success_prob.toFixed(3)}</div>
        <div class="tip-detail">Relevance: ${d.data.relevance.toFixed(4)} | Obs: ${d.data.observations}</div>
        <div class="tip-detail">${d.data.description}</div>
      `;
    }).on('mousemove', (event) => {
      const tooltip = document.getElementById('tooltip');
      tooltip.style.left = (event.pageX + 15) + 'px';
      tooltip.style.top = (event.pageY - 10) + 'px';
    }).on('mouseout', () => {
      document.getElementById('tooltip').style.display = 'none';
    }).on('click', (event, d) => {
      selectNode(d);
    });
  
  // Force simulation
  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(100).strength(0.1))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => d.radius + 5))
    .on('tick', () => {
      g.select('.edges').selectAll('.edge')
        .attr('x1', d => d.source.x)
        .attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x)
        .attr('y2', d => d.target.y);
      g.select('.nodes').selectAll('.node')
        .attr('transform', d => `translate(${d.x},${d.y})`);
      g.select('.labels').selectAll('text')
        .attr('x', d => d.x)
        .attr('y', d => d.y + d.radius + 12);
    });
  
  // Re-select if previously selected
  if (selectedNodeData) {
    const found = nodes.find(n => n.id === selectedNodeData.id);
    if (found) {
      selectNode(found);
    }
  }
}

    action: action,
    skill: skill,
    success: success,
    time: new Date().toLocaleTimeString()
  };
  actionLog.unshift(entry);
  if (actionLog.length > 5) actionLog.pop();
  renderLog();
}

function renderLog() {
  const container = document.getElementById('logEntries');
  if (actionLog.length === 0) {
    container.innerHTML = '<div class="log-entry"><span class="log-empty">No actions recorded yet.</span></div>';
    return;
  }
  
  container.innerHTML = actionLog.map(e => `
    <div class="log-entry">
      <span class="log-time">${e.time}</span>
      <div class="log-text">
        <span class="log-action">${e.action}</span>
        <span class="log-skill">${e.skill}</span>
        ${e.success !== null ? `<span style="color:var(--${e.success ? 'success' : 'danger'})"> → ${e.success ? '✓' : '✗'}</span>` : ''}
      </div>
    </div>
  `).join('');
}

// ============================================================
// TASK BANNER
// ============================================================
function showTaskBanner(task) {
  const banner = document.getElementById('taskBanner');
  document.getElementById('taskBannerName').textContent = task;
  banner.classList.add('active');
}

function hideTaskBanner() {
  document.getElementById('taskBanner').classList.remove('active');
}

// ============================================================
// NODE SELECTION & OUTCOME RECORDING
// ============================================================
function selectNode(d) {
  selectedNodeData = d;
  const panel = document.getElementById('detailPanel');
  panel.classList.add('visible');
  document.getElementById('detailName').textContent = d.data.name;
  document.getElementById('detailDesc').textContent = d.data.description || 'No description available.';
  document.getElementById('statScore').textContent = d.data.final_score.toFixed(4);
  document.getElementById('statSuccess').textContent = d.data.success_prob.toFixed(3);
  document.getElementById('statRel').textContent = d.data.relevance.toFixed(4);
  document.getElementById('statObs').textContent = d.data.observations;
  
  // Reset outcome feedback
  document.getElementById('outcomeFeedback').className = 'outcome-feedback';
  document.getElementById('outcomeFeedback').textContent = '';
  
  // Highlight in list
  document.querySelectorAll('.rank-item').forEach((el, i) => {
    el.classList.toggle('selected', currentRanking[i] && currentRanking[i].name === d.id);
  });
}

function recordOutcome(skillName, success) {
  const record = {
    skill: skillName,
    success: success ? 1 : 0,
    timestamp: new Date().toISOString()
  };
  allRecords.push(record);
  
  // Add to log
  addLogEntry('recorded', skillName, success);
  
  // Re-rank and pulse
  const ranking = rankSkills(currentTask, EMBEDDED_SKILLS, allRecords, 20);
  updateGraph(ranking, skillName);
  updateRankedList(ranking);
  
  // Show feedback AFTER graph update (so it isn't cleared by selectNode)
  const feedback = document.getElementById('outcomeFeedback');
  feedback.className = 'outcome-feedback show ' + (success ? 'success' : 'failure');
  feedback.textContent = success 
    ? `✓ Recorded success for "${skillName}"` 
    : `✗ Recorded failure for "${skillName}"`;
  
  // Update status
  document.getElementById('statusBar').textContent = 
    `Recorded ${success ? 'success' : 'failure'} for "${skillName}" | ${allRecords.length} total records | ${new Date().toLocaleTimeString()}`;
}

// ============================================================
// LIVE MODE
// ============================================================
let liveMode = false;
let livePollingInterval = null;
let lastPolledRecords = allRecords.length;
const POLL_INTERVAL_MS = 3000;

function toggleLiveMode() {
  liveMode = !liveMode;
  const btn = document.getElementById('liveToggle');
  const indicator = document.getElementById('liveIndicator');
  const logDot = document.getElementById('logLiveDot');
  
  btn.classList.toggle('active', liveMode);
  indicator.classList.toggle('active', liveMode);
  logDot.classList.toggle('active', liveMode);
  
  if (liveMode) {
    startLivePolling();
    addLogEntry('live mode', 'enabled', null);
    updateStatus('Live Mode ON — polling for updates...');
  } else {
    stopLivePolling();
    addLogEntry('live mode', 'disabled', null);
    updateStatus('Live Mode OFF');
  }
}

function startLivePolling() {
  if (livePollingInterval) clearInterval(livePollingInterval);
  
  livePollingInterval = setInterval(async () => {
    try {
      // Attempt to poll ATSM API endpoint
      const response = await fetch('http://localhost:8765/atsm/status', {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        signal: AbortSignal.timeout(2000)
      });
      
      if (response.ok) {
        const data = await response.json();
        handleLiveUpdate(data);
      }
    } catch (e) {
      // Endpoint unavailable — silently continue (could also log)
    }
  }, POLL_INTERVAL_MS);
}

function stopLivePolling() {
  if (livePollingInterval) {
    clearInterval(livePollingInterval);
    livePollingInterval = null;
  }
}

function handleLiveUpdate(data) {
  if (data.new_records && data.new_records.length > 0) {
    const newRecords = data.new_records.filter(r => {
      return !allRecords.some(existing => 
        existing.skill === r.skill && 
        existing.timestamp === r.timestamp &&
        existing.success === r.success
      );
    });
    
    if (newRecords.length > 0) {
      allRecords.push(...newRecords);
      
      // Log new actions
      newRecords.forEach(r => {
        addLogEntry('auto-detected', r.skill, r.success === 1);
      });
      
      // Show current task if provided
      if (data.current_task) {
        showTaskBanner(data.current_task);
      }
      
      // Re-rank and pulse affected skills
      const affectedSkills = [...new Set(newRecords.map(r => r.skill))];
      const ranking = rankSkills(currentTask, EMBEDDED_SKILLS, allRecords, 20);
      updateGraph(ranking, affectedSkills[0]);
      updateRankedList(ranking);
      
      updateStatus(`Live: ${newRecords.length} new outcome(s) detected | ${allRecords.length} total`);
    }
  }
  
  if (data.current_task) {
    showTaskBanner(data.current_task);
  }
}

// ============================================================
// THEME TOGGLE
// ============================================================
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  document.getElementById('themeLabel').textContent = next === 'light' ? 'Light' : 'Dark';
  localStorage.setItem('atsm-theme', next);
}

function loadTheme() {
  const saved = localStorage.getItem('atsm-theme');
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeLabel').textContent = 'Light';
  }
}

// ============================================================
// MAIN RANKING TRIGGER
// ============================================================
function runRanking(task) {
  if (!task.trim()) return;
  
  currentTask = task;
  showTaskBanner(task);
  
  const overlay = document.getElementById('loadingOverlay');
  overlay.style.display = 'flex';
  
  addLogEntry('ranking for', task, null);
  
  setTimeout(() => {
    const ranking = rankSkills(task, EMBEDDED_SKILLS, allRecords, 20);
    
    updateGraph(ranking);
    updateRankedList(ranking);
    
    updateStatus(`Ranked ${ranking.length} skills for "${task}" | ${allRecords.length} records | ${new Date().toLocaleTimeString()}`);
    
    overlay.style.display = 'none';
    
    // Auto-hide banner after ranking completes
    setTimeout(hideTaskBanner, 2000);
  }, 50);
}

function updateStatus(text) {
  document.getElementById('statusBar').textContent = text;
}

// ============================================================
// AUTO-REFRESH
// ============================================================
let autoRefreshInterval = null;

function startAutoRefresh() {
  if (autoRefreshInterval) clearInterval(autoRefreshInterval);
  autoRefreshInterval = setInterval(() => {
    if (!liveMode) {
      runRanking(currentTask);
      const indicator = document.getElementById('refreshIndicator');
      indicator.style.opacity = '1';
      setTimeout(() => indicator.style.opacity = '1', 200);
    }
  }, 30000); // 30s auto-refresh when not in live mode
}

// ============================================================
// INITIALIZATION
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  loadTheme();
  initGraph();
  runRanking(currentTask);
  startAutoRefresh();
  
  // Input handling
  const input = document.getElementById('taskInput');
  const btn = document.getElementById('rankBtn');
  
  const trigger = () => runRanking(input.value);
  btn.addEventListener('click', trigger);
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') trigger();
  });
  
  // Theme toggle
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  
  // Live mode toggle
  document.getElementById('liveToggle').addEventListener('click', toggleLiveMode);
  
  // Task banner close
  document.getElementById('taskBannerClose').addEventListener('click', hideTaskBanner);
  
  // Outcome recording
  document.getElementById('recordSuccess').addEventListener('click', () => {
    if (selectedNodeData) {
      recordOutcome(selectedNodeData.id, true);
    }
  });
  document.getElementById('recordFailure').addEventListener('click', () => {
    if (selectedNodeData) {
      recordOutcome(selectedNodeData.id, false);
    }
  });
  
  // Window resize
  window.addEventListener('resize', () => {
    initGraph();
    runRanking(currentTask);
  });
});
</script>
